# @package _global_
env:
  parallel_envs: 20 #10 original
   # Control agent levels -newly added
  min_player_level: 1
  max_player_level: 1

  # Control food levels - newly added
  min_food_level: 1
  max_food_level: 2
  
  #max_episode_steps: 200 #newly added

algorithm:
  _target_: ac.train.main
  total_steps: 10000000  #newly added
  name: "mappo"
  model:
    _target_: ac.model.PPONetwork
    actor:
      layers:
        - 128 #original 128 & 256
        - 128 #original 128
      parameter_sharing: False # True/False/List[int] (seps_indices)
      use_orthogonal_init: True
      use_rnn: True #False
    critic:
      centralised: True
      layers:
        - 256  #original 128
        - 256  #original 128
      parameter_sharing: False # True/False/List[int] (seps_indices)
      use_orthogonal_init: True
      use_rnn: True #False

    device : "cuda"  # a pytorch device ("cpu" or "cuda")

  optimizer : "Adam"
  lr: 3.e-4

  grad_clip: 0.5 #False

  n_steps: 128 #5
  gamma: 0.995 #0.99
  entropy_coef: 0.005 #original 0.001 & 0.01 0.05
  value_loss_coef: 0.5
  use_proper_termination: True #False
  standardise_returns: True  #False
  
  num_epochs: 4
  ppo_clip: 0.3 #original 0.2

  target_update_interval_or_tau: 200
